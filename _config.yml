# The Site Configuration

# Import the theme
theme: jekyll-theme-chirpy

# The language of the webpage
lang: en

# Timezone: Set as per user's local timezone
timezone: 

# jekyll-seo-tag settings
title: Sankar's Blog
tagline: Simplifying Mastery, One Topic at a Time
description: A software engineer's plain-English guides to AI, LLMs, self-hosting and running a home server, based on real projects.
# Site URL
url: "https://blog.mavsankar.com"

github:
  username: mavsankar
twitter:
  username: mavsankar

# Personal Information
social:
  name: mavsankar
  links:
    - https://github.com/mavsankar

# Google Site Verification
google_site_verification: 9V1SdZUEZ_S_GX86QnfmdbV_u_TRxCeD5NLJy4de9wQ

# Google Analytics ID
google_analytics:
  id: G-LTV5L9YDCR

# Google AdSense
google_adsense:
  client: ca-pub-6963103368727733

# Theme Mode
theme_mode: 

# Avatar URL
avatar: /assets/img/favicons/android-chrome-512x512.png

# Default image for link previews on pages without their own `image`
social_preview_image: /assets/img/favicons/android-chrome-512x512.png

# Author and publisher for structured data (jekyll-seo-tag): Google uses these for articles
author:
  name: Sankar
  url: https://www.mavsankar.com
  twitter: mavsankar
logo: /assets/img/favicons/android-chrome-512x512.png

# Comments System: Utterances
comments:
  active: utterances
  utterances:
    repo: micromastery/micromastery.github.io
    issue_term: title

# PWA feature
pwa:
  enabled: true

# Number of posts per page. The home page lists every post (with a topic filter),
# so keep this above the post count to avoid duplicate /page2/ pages.
paginate: 1000

# Base URL
baseurl: ""

# Other default settings (as per your initial structure)
kramdown:
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    css_class: highlight
    span:
      line_numbers: false
    block:
      line_numbers: true
      start_line: 1

collections:
  tabs:
    output: true
    sort_by: order

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      ads: true
      comments: true
      toc: true
      permalink: /posts/:title/
  - scope:
      path: _drafts
    values:
      comments: false
  - scope:
      path: ""
      type: tabs
    values:
      ads: true
      layout: page
      permalink: /:title/
  - scope:
      path: assets/img/favicons
    values:
      swcache: true
  - scope:
      path: assets/js/dist
    values:
      swcache: true
  - scope:
      path: google55a3c4d1556359c9.html
    values:
      sitemap: false

sass:
  style: compressed

compress_html:
  clippings: all
  comments: all
  endings: all
  profile: false
  blanklines: false
  ignore:
    envs: [development]

exclude:
  - "*.gem"
  - "*.gemspec"
  - docs
  - tools
  - README.md
  - LICENSE
  - rollup.config.js
  - package*.json

jekyll-archives:
  enabled: [categories, tags]
  layouts:
    category: category
    tag: tag
  permalinks:
    tag: /tags/:name/
    category: /categories/:name/
